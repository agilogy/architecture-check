name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Check the version is not published yet
        if: ${{ github.event_name == 'pull_request' }}
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          pom="https://maven.pkg.github.com/$GITHUB_REPOSITORY/cat/coeli/architecture-check/$version/architecture-check-$version.pom"
          status=$(curl -s -o /dev/null -w '%{http_code}' -u "$GITHUB_ACTOR:$TOKEN" "$pom")
          case "$status" in
            404) echo "$version is not published yet" ;;
            200) echo "::error file=gradle.properties::$version is already published: bump version in gradle.properties"; exit 1 ;;
            *) echo "::error::Unexpected HTTP $status asking GitHub Packages for $pom"; exit 1 ;;
          esac
      - run: ./gradlew build
      - name: Publish
        if: ${{ github.event_name == 'push' }}
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish
