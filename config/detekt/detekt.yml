comments:
  UndocumentedPublicClass:
    active: false
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicProperty:
    active: false

naming:
  FunctionNameMaxLength:
    excludes: ['**/test/**', '**/testFixtures/**']

potential-bugs:
  MissingUseCall:
    excludes: ['**/test/**', '**/testFixtures/**']
  UnnamedParameterUse:
    excludes: ['**/test/**', '**/testFixtures/**']

style:
  # ktfmt puts the lines of a raw string followed by trimIndent() at the column of its opening quotes,
  # where this rule wants them indented further. Tests compare multiline texts that way.
  MultilineRawStringIndentation:
    excludes: ['**/test/**', '**/testFixtures/**']
